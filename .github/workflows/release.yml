# Builds Ductus as a universal app and attaches it to a draft GitHub Release.
#
# - Push a tag like v0.1.0: tests, builds, and creates a DRAFT release with the
#   zip, disk image and checksums. Nothing is public until you publish the draft.
#   If a release for the tag already exists, the files are added to it instead.
# - Run it by hand (Actions tab, "Run workflow"): same build, files are kept as
#   a workflow artifact only. Good for checking the build before tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Engine tests
        run: swift test --package-path DuctusEngine

      - name: Every interface string is translated
        run: python3 scripts/check_translations.py

      - name: Build and package
        run: scripts/package.sh build

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: Ductus
          path: |
            build/Ductus-*.zip
            build/Ductus-*.dmg
            build/SHA256SUMS.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(build/Ductus-*.zip build/Ductus-*.dmg build/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A release for this tag already exists (for example made on github.com): add the files to it.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --draft --title "Ductus ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
          fi
